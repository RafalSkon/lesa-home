<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="icon-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Avatar Background -->
  <rect width="100%" height="100%" rx="110" fill="#0f172a" />
  
  <g transform="translate(250, 250)">
    <!-- Outer Calm Zen Arc -->
    <path d="M-114,60 A126,126 0 1,1 75,108" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="33" 
          stroke-linecap="round" />

    <!-- Inner Warm Flow Arc -->
    <path d="M-45,-60 A72,72 0 0,1 60,36" 
          fill="none" 
          stroke="url(#icon-warm)" 
          stroke-width="27" 
          stroke-linecap="round" />

    <!-- Core Node -->
    <circle cx="-6" cy="-6" r="15" fill="#f97316" />
  </g>
</svg>
