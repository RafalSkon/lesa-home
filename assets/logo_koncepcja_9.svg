<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-warm-9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g transform="translate(400, 220)">
    <!-- Harmonic Zen Arch & Balanced Curves -->
    <!-- Left Anchor Arc (Charcoal) -->
    <path d="M-60,50 L-60,-20 A45,45 0 0,1 30,-20 L30,50" 
          fill="none" 
          stroke="#0f172a" 
          stroke-width="24" 
          stroke-linecap="round" />

    <!-- Inverted Intersecting Warm Arc (Terracotta Warmth) -->
    <path d="M-30,-50 L-30,20 A45,45 0 0,0 60,20 L60,-50" 
          fill="none" 
          stroke="url(#grad-warm-9)" 
          stroke-width="24" 
          stroke-linecap="round" 
          opacity="0.95" />

    <!-- Center harmonic node -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="4" />
  </g>

  <!-- Typography -->
  <text x="400" y="435" 
        font-family="'Outfit', -apple-system, sans-serif" 
        font-size="54" 
        font-weight="700" 
        fill="#0f172a" 
        text-anchor="middle" 
        letter-spacing="2px">
    LeSa
  </text>

  <text x="400" y="475" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="16" 
        font-weight="600" 
        fill="#ea580c" 
        text-anchor="middle" 
        letter-spacing="12px">
    HOME
  </text>

  <text x="400" y="515" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="12" 
        font-weight="400" 
        fill="#94a3b8" 
        text-anchor="middle" 
        letter-spacing="3px">
    KOMPLEKSOWE INSTALACJE &amp; WNĘTRZA
  </text>
</svg>
