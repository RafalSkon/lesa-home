<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="100%" height="100%">
  <defs>
    <linearGradient id="zen-warm-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- ================= LOGO SYGNET (LEFT) ================= -->
  <g transform="translate(85, 90)">
    <!-- Outer Calm Zen Arc (White) -->
    <path d="M-38,20 A42,42 0 1,1 25,36" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="11" 
          stroke-linecap="round" />

    <!-- Inner Warm Flow Arc (Bright Warm Amber) -->
    <path d="M-15,-20 A24,24 0 0,1 20,12" 
          fill="none" 
          stroke="url(#zen-warm-w)" 
          stroke-width="9" 
          stroke-linecap="round" />

    <!-- Core Node -->
    <circle cx="-2" cy="-2" r="5" fill="#fb923c" />
  </g>

  <!-- Vertical Divider -->
  <line x1="175" y1="42" x2="175" y2="138" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

  <!-- ================= TYPOGRAPHY (RIGHT) ================= -->
  <g transform="translate(205, 0)">
    <text x="0" y="94" 
          font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" 
          font-size="52" 
          font-weight="800" 
          fill="#ffffff" 
          letter-spacing="-1px">
      LeSa
    </text>

    <text x="132" y="94" 
          font-family="'Outfit', 'Segoe UI', sans-serif" 
          font-size="34" 
          font-weight="600" 
          fill="#fb923c" 
          letter-spacing="2px">
      HOME
    </text>

    <text x="2" y="126" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="11.5" 
          font-weight="600" 
          fill="#94a3b8" 
          letter-spacing="3.5px">
      SYSTEMY GRZEWCZE &amp; WYKOŃCZENIA
    </text>
  </g>
</svg>
