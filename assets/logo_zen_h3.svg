<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="100%" height="100%">
  <defs>
    <linearGradient id="zen-warm-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="none" />

  <!-- ================= LOGO SYGNET (LEFT) ================= -->
  <g transform="translate(85, 90)">
    <!-- Outer Calm Zen Arc (Slate 270 deg) -->
    <path d="M-38,20 A42,42 0 1,1 25,36" 
          fill="none" 
          stroke="#0f172a" 
          stroke-width="11" 
          stroke-linecap="round" />

    <!-- Inner Warm Flow Arc (Terracotta 180 deg) -->
    <path d="M-15,-20 A24,24 0 0,1 20,12" 
          fill="none" 
          stroke="url(#zen-warm-c)" 
          stroke-width="9" 
          stroke-linecap="round" />

    <!-- Pure Core Node -->
    <circle cx="-2" cy="-2" r="5" fill="#ea580c" />
  </g>

  <!-- Vertical Divider -->
  <line x1="175" y1="40" x2="175" y2="140" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />

  <!-- ================= TYPOGRAPHY (RIGHT) ================= -->
  <g transform="translate(205, 0)">
    <text x="0" y="94" 
          font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
          font-size="52" 
          font-weight="800" 
          fill="#0f172a" 
          letter-spacing="-1px">
      LeSa
    </text>

    <text x="132" y="94" 
          font-family="'Outfit', sans-serif" 
          font-size="34" 
          font-weight="600" 
          fill="#ea580c" 
          letter-spacing="2px">
      HOME
    </text>

    <text x="2" y="126" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="11.5" 
          font-weight="600" 
          fill="#64748b" 
          letter-spacing="3.5px">
      KOMPLEKSOWE USŁUGI DLA DOMU
    </text>
  </g>
</svg>
