<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-warm-7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="grad-dark-7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow-7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Subtle decorative ambient circle -->
  <circle cx="400" cy="230" r="140" fill="#fff7ed" opacity="0.7" />

  <g transform="translate(400, 230)" filter="url(#shadow-7)">
    <!-- Smooth Abstract Harmonious S-Ribbon -->
    <!-- Top Arc (Deep Slate) -->
    <path d="M-60,-20 C-60,-75 0,-85 45,-85 C75,-85 95,-65 95,-35 C95,-5 65,15 15,30 L-15,40 C-65,55 -95,75 -95,105 C-95,135 -75,155 -45,155 C0,155 60,145 60,90" 
          fill="none" 
          stroke="url(#grad-dark-7)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Overlapping Warm Flow Accent (Terracotta Glow) -->
    <path d="M-20,-45 C15,-45 45,-30 45,5 C45,35 15,50 -20,60 C-55,70 -70,85 -70,110 C-70,125 -60,135 -40,135 C-10,135 25,120 40,85" 
          fill="none" 
          stroke="url(#grad-warm-7)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.95" />

    <!-- Center Balance Point -->
    <circle cx="0" cy="35" r="9" fill="#ea580c" />
  </g>

  <!-- Typography -->
  <!-- Brand Name 'LeSa' -->
  <text x="400" y="445" 
        font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" 
        font-size="52" 
        font-weight="800" 
        fill="#0f172a" 
        text-anchor="middle" 
        letter-spacing="-1px">
    LeSa
  </text>

  <!-- Subtitle 'HOME' -->
  <text x="400" y="485" 
        font-family="'Outfit', 'Segoe UI', sans-serif" 
        font-size="18" 
        font-weight="600" 
        fill="#ea580c" 
        text-anchor="middle" 
        letter-spacing="10px">
    HOME
  </text>
  
  <text x="400" y="525" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="12" 
        font-weight="500" 
        fill="#94a3b8" 
        text-anchor="middle" 
        letter-spacing="2px">
    SYSTEMY &amp; WYKOŃCZENIA WNĘTRZ
  </text>
</svg>
