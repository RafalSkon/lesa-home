<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="100%" height="100%">
  <defs>
    <linearGradient id="zen-stream-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="none" />

  <!-- ================= LOGO SYGNET (LEFT) ================= -->
  <g transform="translate(85, 90)">
    <!-- Soft background circle -->
    <circle cx="0" cy="0" r="58" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Pure Zen Stream / Harmonious S-Ribbon -->
    <path d="M-28,-36 C-4,-54 36,-44 36,-14 C36,12 -2,22 -18,34 C-34,46 -24,56 0,56 C24,56 38,42 38,30" 
          fill="none" 
          stroke="url(#zen-stream-b)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Secondary Harmonic Echo Arc -->
    <path d="M-36,10 C-36,-16 -12,-30 6,-30" 
          fill="none" 
          stroke="#0f172a" 
          stroke-width="8" 
          stroke-linecap="round" 
          opacity="0.85" />

    <!-- Small Golden Node -->
    <circle cx="20" cy="-14" r="4.5" fill="#f59e0b" />
  </g>

  <!-- Vertical Divider -->
  <line x1="175" y1="40" x2="175" y2="140" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />

  <!-- ================= TYPOGRAPHY (RIGHT) ================= -->
  <g transform="translate(205, 0)">
    <text x="0" y="94" 
          font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
          font-size="52" 
          font-weight="800" 
          fill="#0f172a" 
          letter-spacing="-1px">
      LeSa
    </text>

    <text x="132" y="94" 
          font-family="'Outfit', sans-serif" 
          font-size="34" 
          font-weight="600" 
          fill="#ea580c" 
          letter-spacing="2px">
      HOME
    </text>

    <text x="2" y="126" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="11.5" 
          font-weight="600" 
          fill="#64748b" 
          letter-spacing="3.5px">
      SYSTEMY &amp; WYKOŃCZENIA DOMÓW
    </text>
  </g>
</svg>
