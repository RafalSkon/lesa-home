<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeSa CRM - Panel Montera</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    /* Micro-animacje */
    .btn-hover { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .btn-hover:active { transform: scale(0.97); }
    .card-enter { animation: fade-in-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(10px); }
    @keyframes fade-in-up { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col bg-slate-100">

  <!-- Aplikacja Montera -->
  <div id="monter-app" class="min-h-screen flex flex-col flex-1">
    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md z-10 px-5 py-3.5 flex items-center justify-between sticky top-0">
      <div class="flex items-center gap-3">
        <div class="bg-white/20 p-2 rounded-xl">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        </div>
        <div>
          <h1 class="font-bold leading-tight text-base sm:text-lg">Terminarz Zleceń</h1>
          <p class="text-[10px] text-blue-100 uppercase tracking-wider font-semibold">LeSa Ekipa Montażowa</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="admin.html" class="px-3 py-1.5 bg-blue-700 hover:bg-blue-800 text-white text-xs font-semibold rounded-lg transition-colors flex items-center gap-1.5 shadow-sm">
          <span>Panel Admina</span>
        </a>
        <button onclick="MonterApp.logout()" title="Wyloguj" class="p-2 bg-blue-700 rounded-lg hover:bg-blue-800 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
      </div>
    </header>

    <!-- Lista Zleceń (Terminarz) -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Lewa kolumna: Kalendarz -->
        <div class="lg:col-span-5 flex flex-col gap-3">
          <div class="flex justify-between items-center px-1">
            <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
              <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              Kalendarz Prac
            </h2>
            <div class="flex items-center gap-1.5">
              <button onclick="MonterApp.changeMonth(-1)" title="Poprzedni miesiąc" class="p-1.5 rounded-lg bg-white shadow-sm border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
              </button>
              <button onclick="MonterApp.resetMonth()" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-white shadow-sm border border-slate-200 text-slate-700 hover:bg-slate-50 transition-colors">
                Dziś
              </button>
              <button onclick="MonterApp.changeMonth(1)" title="Następny miesiąc" class="p-1.5 rounded-lg bg-white shadow-sm border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
              </button>
            </div>
          </div>
          
          <div id="monter-calendar-container" class="w-full">
            <!-- JS wygeneruje tutaj bieżący miesiąc -->
          </div>

          <!-- Legenda -->
          <div class="bg-white rounded-xl p-3 border border-slate-200 text-xs flex flex-wrap items-center gap-4 text-slate-600 shadow-sm">
            <div class="flex items-center gap-1.5">
              <span class="w-3.5 h-3.5 rounded-md bg-blue-600 inline-block shadow-sm"></span>
              <span class="font-medium text-slate-700">Zaplanowany montaż</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="w-3.5 h-3.5 rounded-md bg-blue-50 border-2 border-blue-400 inline-block"></span>
              <span class="font-medium text-slate-700">Dzisiejszy dzień</span>
            </div>
          </div>
        </div>

        <!-- Prawa kolumna: Zlecenia i zadania -->
        <div class="lg:col-span-7 flex flex-col gap-3">
          <div id="monter-daily-tasks" class="w-full">
             <div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-3">
               <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2" id="daily-tasks-header">
                 <span>Zlecenia do montażu</span>
               </h3>
               <button id="btn-show-all-tasks" onclick="MonterApp.showAllTasks()" class="hidden text-xs text-blue-600 hover:text-blue-800 font-bold px-2.5 py-1 rounded-lg bg-blue-50 hover:bg-blue-100 transition-colors">
                 Pokaż wszystkie
               </button>
             </div>
             <div id="monter-projects-list" class="flex flex-col gap-3">
               <!-- JS wstawi kafelki dla wybranego dnia lub wszystkich -->
             </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal Szczegółów Zlecenia -->
  <div id="monter-project-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex-col justify-end">
    <!-- Półprzezroczyste tło do zamknięcia -->
    <div class="absolute inset-0" onclick="MonterApp.closeProject()"></div>
    
    <!-- Zawartość -->
    <div class="relative bg-white w-full rounded-t-3xl max-h-[90vh] flex flex-col shadow-2xl transform transition-transform translate-y-0" id="modal-content">
      
      <div class="flex justify-center py-3" onclick="MonterApp.closeProject()">
        <div class="w-12 h-1.5 bg-slate-300 rounded-full"></div>
      </div>
      
      <div class="px-6 pb-2">
        <div class="inline-block px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-lg mb-3 uppercase" id="modal-date-badge">
          --
        </div>
        <h2 id="modal-project-title" class="text-2xl font-bold text-slate-800 leading-tight">...</h2>
        <p id="modal-project-address" class="text-slate-500 font-medium text-sm mt-1">...</p>
      </div>

      <div class="flex-1 overflow-y-auto px-6 py-4 border-t border-slate-100 mt-2 bg-slate-50">
        
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm mb-5">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Dane techniczne (z CAD)</h3>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <p class="text-[10px] text-slate-400 font-semibold uppercase">Ilość Pętli</p>
              <p class="font-bold text-slate-800 text-lg" id="modal-loops">0</p>
            </div>
            <div>
              <p class="text-[10px] text-slate-400 font-semibold uppercase">Długość Rur</p>
              <p class="font-bold text-slate-800 text-lg"><span id="modal-pipe">0</span> mb</p>
            </div>
          </div>
        </div>

        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 pl-1">Dokumenty do wystawienia</h3>
        
        <div class="flex flex-col gap-3">
          <button onclick="MonterApp.openProtocol('szczelnosc')" class="bg-emerald-600 text-white p-4 rounded-2xl flex items-center justify-between hover:bg-emerald-700 btn-hover shadow-lg shadow-emerald-200/50">
            <div class="text-left flex-1">
              <span class="font-bold text-lg mb-0.5 flex items-center gap-2">
                Protokół Szczelności
                <span id="monter-badge-szczelnosc" class="hidden text-[10px] bg-white text-emerald-700 px-2 py-0.5 rounded-full font-extrabold uppercase">Wypełniony</span>
              </span>
              <span class="block text-emerald-100 text-xs">Wygeneruj PDF po wykonanej próbie</span>
            </div>
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
          </button>
          
          <button onclick="MonterApp.openProtocol('gwarancja')" class="bg-slate-800 text-white p-4 rounded-2xl flex items-center justify-between hover:bg-slate-900 btn-hover shadow-lg shadow-slate-300">
            <div class="text-left flex-1">
              <span class="font-bold text-lg mb-0.5 flex items-center gap-2">
                Protokół Odbioru
                <span id="monter-badge-odbior" class="hidden text-[10px] bg-white text-slate-800 px-2 py-0.5 rounded-full font-extrabold uppercase">Wypełniony</span>
              </span>
              <span class="block text-slate-300 text-xs">Protokół przekazania instalacji</span>
            </div>
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
            </div>
          </button>
        </div>
        
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 pl-1 mt-6">Zdjęcia z montażu</h3>
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm mb-5" id="monter-photos-container">
          <div id="monter-rooms-photos-list" class="flex flex-col gap-3">
            <!-- JS wstawi tutaj listę pomieszczeń -->
          </div>
        </div>
        
      </div>
    </div>
  </div>

  <script src="js/api-service.js?v=8"></script>
  <script src="js/monter.js?v=7"></script>
</body>
</html>
